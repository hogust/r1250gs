name: Update R1250GS analysis

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - feature/cloudflare-pages-hosting
    paths-ignore:
      - data/market_history.csv

permissions:
  contents: write
  deployments: write

jobs:
  build-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate analysis
        run: |
          mkdir -p public
          python src/r1250gs.py \
            --out public/r1250gs_blocket.csv \
            --html public/index.html

      - name: Add filters and update market history
        run: |
          python src/enhance_site.py \
            --csv public/r1250gs_blocket.csv \
            --html public/index.html \
            --history data/market_history.csv

      - name: Save market history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update market history [skip ci]"
            git push
          fi

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: r1250gs-analysis
          path: public/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=r1250gs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
